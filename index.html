<title>NORVEX | Guía de Emergencia</title>

<style>
*{

    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(180deg,#050505,#111111);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.contenedor{
    width:100%;
    max-width:480px;

.icono{

}

h1{
    font-size:30px;
    margin-bottom:20px;
    color:white;
}

p{
    color:#d7d7d7;
    font-size:17px;
    line-height:1.7;
    margin-bottom:35px;
}

.boton{
    display:block;
    width:100%;
    padding:18px;
    text-decoration:none;
    background:#D4AF37;
    color:#111;
    font-size:20px;
    font-weight:bold;
    border-radius:12px;
    transition:.25s;
}

.boton:hover{
    background:#f0c94c;
    transform:translateY(-2px);
}

.footer{
    margin-top:35px;
    font-size:13px;
    color:#888;
}
</style>

</head>
